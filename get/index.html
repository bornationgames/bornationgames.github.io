<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Real Shot: Get the game</title>
  <meta name="description" content="Real Shot is free on iPhone and Android. Real gameplay. No tricks.">
  <meta property="og:title" content="Real Shot: Not Fake">
  <meta property="og:description" content="Free on iPhone &amp; Android. Real gameplay. No tricks.">
  <meta property="og:image" content="https://bornationgames.github.io/images/logo.png">
  <meta property="og:url" content="https://bornationgames.github.io/get/">
  <meta name="theme-color" content="#10508a">
  <link rel="icon" href="../images/tile.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      background: #10508a url("../images/tile.png") repeat;
      background-size: 110px;
    }
    main { width: min(400px, 100%); text-align: center; }
    .logo {
      display: block;
      width: min(380px, 92%);
      height: auto;
      margin: 0 auto 18px;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35));
    }
    h1 {
      font-family: "Lilita One", system-ui, sans-serif;
      font-weight: 400;
      font-size: clamp(1.25rem, 6.4vw, 1.75rem);   /* one line on phones */
      line-height: 1.15;
      margin: 0 0 22px;
      white-space: nowrap;
      text-shadow: 0 3px 0 #0a2a4d, 0 0 2px #0a2a4d;
    }
    .store {
      display: block;
      margin: 0 0 14px;
      padding: 14px 20px;
      border-radius: 16px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.55rem;
      line-height: 1.1;
      box-shadow: 0 6px 0 #000, 0 10px 18px rgba(0, 0, 0, 0.3);
      -webkit-tap-highlight-color: transparent;
    }
    .store { display: flex; align-items: center; justify-content: center; gap: 14px; }
    .store svg { width: 38px; height: 38px; flex: none; }
    .store span { text-align: left; }
    .store small { display: block; font-size: 0.8rem; font-weight: 600; opacity: 0.85; letter-spacing: 0.02em; }
    .store:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }
    .store:focus-visible { outline: 3px solid #ffce40; outline-offset: 3px; }
    .note {
      margin: 18px 0 0;
      font-family: "Lilita One", system-ui, sans-serif;
      font-size: 1.15rem;
      color: #ffce40;
      text-shadow: 0 2px 0 #0a2a4d;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="../images/logo.png?v=2" alt="Real Shot" width="878" height="425">
    <h1>FREE ON iPHONE &amp; ANDROID</h1>
    <div id="stores">
      <a class="store" id="store-apple" href="https://apps.apple.com/app/real-shot-not-fake/id6819035838">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
        <span><small>Download on the</small>App Store</span></a>
      <a class="store" id="store-play"
         href="https://play.google.com/store/apps/details?id=com.realshot.game&amp;referrer=utm_source%3Dtiktok%26utm_medium%3Dbio">
        <svg viewBox="0 0 24 24" aria-hidden="true" stroke-linejoin="round">
          <polygon fill="#00C3FF" stroke="#00C3FF" stroke-width="0.8" points="3.5,2.5 13.3,12 3.5,21.5"/>
          <polygon fill="#00E676" stroke="#00E676" stroke-width="0.8" points="3.5,2.5 16.8,9.7 13.3,12"/>
          <polygon fill="#FF3D47" stroke="#FF3D47" stroke-width="0.8" points="3.5,21.5 13.3,12 16.8,14.3"/>
          <polygon fill="#FFD400" stroke="#FFD400" stroke-width="0.8" points="16.8,9.7 21,12 16.8,14.3 13.3,12"/>
        </svg>
        <span><small>Get it on</small>Google Play</span></a>
    </div>
    <p class="note">Real gameplay. No tricks.</p>
  </main>
  <script>
    // The visitor's own store goes on top (iPhone/iPad: App Store, Android: Google Play); both stay visible.
    var ua = navigator.userAgent || "";
    if (/Android/i.test(ua)) {
      var s = document.getElementById("stores");
      s.insertBefore(document.getElementById("store-play"), s.firstChild);
    }
  </script>
</body>
</html>
